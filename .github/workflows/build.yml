# Builds the solution and runs the tests on every push to main and on every pull request.
name: build

on:
  push:
    branches: [main]
  pull_request:

# Only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    # WPF only builds and runs on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build cobihw.slnx -c Release

      # global.json selects Microsoft Testing Platform, the runner xUnit v3 uses.
      - name: Test
        run: dotnet test --project tests/CobiHw.Tests/CobiHw.Tests.csproj -c Release --no-build
